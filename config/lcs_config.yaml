# LCS (Laboratory Control Sample) Historic Drift Detection Configuration
#
# Keys read by src/detectors/control_detector.py (LCSDetector). Matches the
# approach in notebooks/LCS_drift_detection_historic.ipynb: a persistent,
# per-(analyte_code, std_code, scheme_code) rolling history, scaled so
# target -> 0 and the failure limit -> +/-1. Which rows count as LCS is
# decided by src/data_validator.select_lcs_rows(), not here.

# Where the persisted rolling history is stored (CSV, one row per retained
# historical observation).
history_path: data/processed/lcs_standard_history.csv

# Separate history store used by the proof of concept (poc/server.py) when
# its "Use history" toggle is on. It is rebuilt from the uploaded file on
# every run, so it must never point at history_path.
demo_history_path: data/processed/lcs_history_poc.csv

# std_code values that are not genuine reference-material identifiers and
# must be excluded before history is ever built.
excluded_std_codes: ["", "Sample", "TSV_BLANK"]

# Maximum retained historical observations per (analyte_code, std_code,
# scheme_code) group.
max_history_per_analyte: 30

# Below this many observations (including the one being evaluated): the
# latest result is still checked against its limits (point status), but no
# trend is assessed; a within-limits result is reported INSUFFICIENT_HISTORY.
min_history_point: 3

# Below this many (but >= min_history_point): trend is computed but reported
# at reduced confidence and never auto-escalates to a *_FAILURE_DRIFT.
min_history_trend: 6

# Most recent, valid, transformed observations used for the Theil-Sen trend
# fit (or all available if fewer than this).
trend_window: 10

# |slope| below this counts as FLAT, not UP/DOWN.
slope_eps: 1.0e-6

# Minimum directional consistency ("trend strength") required before a
# trend is allowed to escalate severity or show a boundary projection.
trend_strength_min_for_escalation: 0.6

# Fraction of the way from target to the warning boundary a consistent
# trend must have covered before it escalates from *_WARNING_DRIFT to
# *_FAILURE_DRIFT.
trend_progress_min_for_failure_drift: 0.75

# An observation whose transformed value ("offset") exceeds +/- this bound
# is still analysed and flagged normally, but is excluded from the
# persisted history so a wild/error-like reading can't distort future
# trend fits.
offset_exclusion_bound: 2.0

# Enable/disable this detector.
enabled: true
